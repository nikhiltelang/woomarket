<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · WooMarket360</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">WooMarket360</span>
    <span class="user"><span id="user-name"></span><button class="btn link" id="logout-btn">Sign out</button></span>
  </header>
  <main>
    <div id="denied" class="notice" hidden>You don't have access to Application Update. It is available to superadmins only.</div>
    <div class="card">
      <h2>Dashboard</h2>
      <p class="muted" id="welcome"></p>
      <div id="settings" hidden>
        <div class="label">Settings</div>
        <p><a href="/app-update">Application Update</a>: upload a release ZIP and apply it in place.</p>
      </div>
    </div>
  </main>
  <script type="module">
    import { loadUser } from "/assets/common.js";

    const user = await loadUser();
    document.getElementById("welcome").textContent = `Signed in as ${user.username} (${user.role}).`;
    document.getElementById("settings").hidden = user.role !== "superadmin";
    document.getElementById("denied").hidden = new URLSearchParams(location.search).get("denied") !== "app-update";
  </script>
</body>
</html>
