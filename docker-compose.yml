# Local / single-host stack: app + MySQL 8.
#   cp .env.example .env   (set SESSION_SECRET, ENCRYPTION_KEY, MYSQL_* below)
#   docker compose up -d --build
# The app creates its tables and seeds the superadmin on first start.
#
# Optional Redis (several app servers sharing the work, Superadmin → Queue & scaling):
#   docker compose --profile redis up -d --build
# then enter redis://redis:6379/0 as the Redis URL (or set REDIS_URL below).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: woomarket360
      MYSQL_USER: woomarket360
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-woomarket360}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    # Queue state only (messages live in MySQL): append-only file so restarts keep scheduled jobs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://woomarket360:${MYSQL_PASSWORD:-woomarket360}@mysql:3306/woomarket360
      # REDIS_URL: redis://redis:6379/0   # with --profile redis; or set it in Superadmin → Queue & scaling
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  redis_data:
  uploads_data:
